plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.mirror'
version = '0.1.0'

android {
  namespace "app.mirror.nativemod"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  // The pose model ships inside the app.
  sourceSets { main { assets.srcDirs += ["../../../../models/pose", "../../../../models/face"] } }
}

dependencies {
  implementation('com.google.mediapipe:tasks-vision:0.10.21') {
    // Google's log uploader. src/main/java/com/google/android/datatransport holds empty stand-ins.
    exclude group: 'com.google.android.datatransport'
    exclude group: 'com.google.firebase'
  }
  implementation 'androidx.camera:camera-camera2:1.5.3'
  implementation 'androidx.camera:camera-lifecycle:1.5.3'
  implementation 'androidx.camera:camera-view:1.5.3'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
