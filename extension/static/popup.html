<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mirror</title><link rel="stylesheet" href="eye.css"><link rel="stylesheet" href="style.css"></head>
<body class="popup"><p id="banner" hidden>Demo: fast clock, separate data</p>
<header><h1>Mirror</h1><span id="time"></span></header>
<div class="face"><div id="eye"></div><span id="score">0</span></div>
<p id="status"></p><p id="doing"></p><ul id="why"></ul>
<div class="stats"><div><b id="screen">0</b>screen min</div><div><b id="doom">0</b>doom min</div><div><b id="late">0</b>late min</div></div>
<div class="buttons"><button id="share" class="primary">Connect devices and report</button><button id="intent">I'm here on purpose</button></div>
<label class="alerts"><input id="alerts" type="checkbox"> Alert me 25 seconds after I switch to a time-waster</label>
<footer><button id="privacy" class="link">Privacy and data</button><button id="posture" class="link">Posture</button><button id="demo" class="link">Start demo</button></footer>
<script type="module" src="popup.js"></script></body></html>
